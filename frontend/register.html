<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 매장 회원가입 · TLJ</title><link rel="stylesheet" href="style.css"><script defer src="js/common.js"></script><script defer src="js/auth.js"></script></head><body data-page="register"><main class="login-screen"><section class="login-card"><span class="logo">T</span><h1>우리 매장 회원가입</h1><p class="muted">4자리 회원번호와 이름을 등록하세요.</p><form id="memberForm"><label>회원번호<input id="memberCode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="username" placeholder="예: 0123" required></label><label>이름<input id="memberName" maxlength="30" autocomplete="name" placeholder="이름을 입력하세요" required></label><p id="loginError" role="alert"></p><div class="login-actions"><button id="authSubmit" type="submit" class="primary" disabled>가입하고 시작하기</button></div></form><a class="guest-link" href="login.html">로그인으로 돌아가기</a><a class="guest-link" href="guest-request.html">비회원 페이지로 이동 →</a></section></main><div id="toast" role="status" hidden></div></body></html>
