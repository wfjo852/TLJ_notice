<div class="intro"><div><div class="eyebrow">CUSTOMER CLAIMS</div><h1>클레임 관리</h1><p>연락처별 마지막 클레임과 누적 횟수를 확인하세요.</p></div><button id="newClaim" class="primary">＋ 클레임 등록</button></div>
<section class="board-panel"><div class="list-toolbar"><div><h2>연락처별 클레임</h2><span id="total" class="count">0</span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="연락처 또는 물품·내용 검색" aria-label="연락처 또는 물품·내용 검색"></label></div><div id="posts"></div></section>

<dialog id="claimDialog" class="wide"><form id="claimForm"><div class="dialog-heading"><h2>클레임 등록</h2><button type="button" class="icon" data-close="claimDialog" aria-label="닫기">×</button></div>
<div class="claim-form-grid"><label>연락처<input id="claimPhone" type="tel" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000" maxlength="13" required></label><label>구매 날짜<input id="claimDate" type="date" required></label></div>
<label>구매 물품<input id="claimItem" maxlength="100" placeholder="예) 딸기 생크림 케이크" required></label>
<label>클레임 내용<textarea id="claimContent" rows="4" maxlength="5000" required></textarea></label>
<label class="check-label"><input id="claimResolved" type="checkbox"> 처리 완료</label>
<label>클레임 처리 방법 <small class="muted">(선택 · 댓글로 등록됩니다)</small><textarea id="claimComment" rows="3" maxlength="5000"></textarea></label>
<p id="claimError" class="form-error" role="alert"></p>
<div class="form-actions"><button type="button" class="quiet" data-close="claimDialog">취소</button><button id="claimSubmit" class="primary">등록</button></div></form></dialog>
<div id="toast" role="status" hidden></div></body></html>
