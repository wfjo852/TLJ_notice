<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User 관리 · TLJ</title><link rel="stylesheet" href="style.css">
  <script defer src="js/common.js"></script><script defer src="js/users.js"></script>
</head>
<body data-mode="member">
  <main id="usersPanel" class="users-page" hidden>
    <div class="intro"><div><div class="eyebrow">USER MANAGEMENT</div><h1>User 관리</h1><p>사용자 이름과 게시판별 권한을 관리합니다.</p></div><a href="cake.html" class="secondary">게시판으로</a></div>
    <p class="muted">기본 권한: 모든 게시판 읽기 · 필요 물품 요청 쓰기, 수정, 삭제. 수정·삭제 권한은 해당 게시판의 모든 글에 적용됩니다.</p>
    <label class="user-search">사용자 검색<input id="userSearch" type="search" placeholder="회원번호 또는 이름"></label>
    <p id="userCount" class="muted" role="status"></p>
    <div id="userList"></div>
    <p id="usersError" role="alert"></p>
  </main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
