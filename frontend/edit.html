<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 · TLJ</title><link rel="stylesheet" href="style.css"><script defer src="js/common.js"></script><script defer src="js/dialogs.js"></script><script defer src="js/editor.js"></script><script defer src="js/editor-page.js"></script></head><body data-mode="member" data-page="edit"><main class="standalone-main"><p id="pageStatus" role="status">게시글을 불러오는 중입니다.</p><section id="editorPage" class="standalone-card" hidden><form id="postForm"><div class="dialog-heading"><div><span class="eyebrow" id="editorCategory"></span><h2 id="editorHeading">새 글 작성</h2></div><button type="button" id="closeEditor" class="icon" aria-label="작성 취소">×</button></div><label>제목<input id="postTitle" maxlength="150" required placeholder="제목을 입력하세요"></label><label id="guestLabel">작성자 (선택)<input id="guestName" maxlength="30" placeholder="미입력 시 비회원"></label><label>내용</label><div id="richTools" class="rich-tools"><button type="button" data-format="bold"><b>굵게</b></button><button type="button" data-format="italic"><i>기울임</i></button><button type="button" data-format="underline"><u>밑줄</u></button><button type="button" data-format="insertUnorderedList">목록</button><button type="button" data-format="removeFormat">서식 지우기</button><label class="file-button">이미지 추가<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><label class="file-button">동영상 추가<input id="videoInput" type="file" accept="video/mp4,video/webm" hidden></label></div><textarea id="plainBody" rows="12" placeholder="내용을 입력하세요"></textarea><div id="richBody" contenteditable="true" role="textbox" aria-label="공지사항 내용" aria-multiline="true" hidden></div><div id="attachments" class="attachments"></div><p id="draftStatus" class="muted" aria-live="polite"></p><div class="form-actions"><button type="button" id="discardDraft" class="quiet">임시저장 삭제</button><button type="submit" class="primary" id="savePost">게시하기</button></div></form></section></main><div id="toast" role="status" hidden></div></body></html>
