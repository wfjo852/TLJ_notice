<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포스 교육 · TLJ</title><link rel="stylesheet" href="style.css"><script defer src="js/common.js"></script><script defer src="js/navigation.js"></script><script defer src="js/pos.js"></script></head><body data-mode="member" data-page="pos"><main class="standalone-main pos-main">
<div class="pos">
<div class="pos-top"><div class="pos-sections"><button type="button" data-section="bread" aria-pressed="true">빵</button><button type="button" data-section="sandwich" aria-pressed="false">샌드위치/샐러드</button></div><div class="pos-actions"><button type="button" id="addProduct" class="secondary pos-edit">＋ 제품 추가</button><button type="button" id="editToggle" class="secondary" aria-pressed="false" hidden>편집</button></div></div>
<div class="pos-body">
<aside class="pos-cats"><div id="cats"></div><button type="button" id="addCat" class="secondary pos-edit">＋ 분류 추가</button></aside>
<section class="pos-grid-wrap"><div id="grid" class="pos-grid"></div>
<div class="pos-pager"><button type="button" id="prevPage" class="secondary" aria-label="이전 페이지">◀</button><span id="pageInfo">1 / 1</span><button type="button" id="nextPage" class="secondary" aria-label="다음 페이지">▶</button><button type="button" id="addPage" class="quiet pos-edit">＋ 페이지</button><button type="button" id="removePage" class="quiet pos-edit">− 현재 페이지</button></div>
<p class="muted pos-edit">제품을 끌어다 놓거나, 제품을 선택한 뒤 빈 칸을 누르면 배치됩니다. 제품끼리 끌어 놓으면 자리가 바뀝니다.</p></section>
</div>
<div class="pos-bottom"><div id="selInfo"></div><div class="pos-actions"><button type="button" id="unplace" class="quiet pos-edit">칸 비우기</button><button type="button" id="editProduct" class="secondary pos-edit">제품 수정</button><button type="button" id="detailBtn" class="primary" disabled>상세보기</button></div></div>
</div>
<section class="board-panel pos-pool pos-edit"><div class="list-toolbar"><div><h2>제품 목록</h2><span id="poolCount" class="count">0</span></div><label class="search"><span>⌕</span><input id="poolSearch" type="search" placeholder="제품명·번호 검색" aria-label="제품명·번호 검색"></label></div><div id="poolList"></div></section>
</main>
<dialog id="addDialog"><form id="addForm"><div class="dialog-heading"><h2>제품 추가</h2><button type="button" class="icon" data-close="addDialog" aria-label="닫기">×</button></div>
<label>제품번호<input id="addNum" inputmode="numeric" maxlength="9" placeholder="예) 5571"></label>
<p class="muted">홈페이지 주소의 prod_num 값입니다. 이름·설명·이미지를 자동으로 가져옵니다.</p>
<label>또는 제품명 <small class="muted">(수동 추가)</small><input id="addName" maxlength="100"></label>
<p id="addError" class="form-error" role="alert"></p>
<div class="form-actions"><button type="button" class="quiet" data-close="addDialog">취소</button><button id="addSubmit" class="primary">추가</button></div></form></dialog>
<dialog id="productDialog" class="wide"><form id="productForm"><div class="dialog-heading"><h2>제품 수정</h2><button type="button" class="icon" data-close="productDialog" aria-label="닫기">×</button></div>
<input type="hidden" id="productId"><p id="productNum" class="muted"></p>
<div class="pos-product-form"><img id="productPreview" alt="" hidden><div>
<label>제품명<input id="productName" maxlength="100" required></label>
<label>가격<input id="productPrice" type="number" min="0" step="100" inputmode="numeric" placeholder="미입력"></label>
<label>이미지 변경 <small class="muted">(가로 200px로 저장)</small><input id="productImage" type="file" accept="image/png,image/jpeg,image/webp"></label></div></div>
<label>설명<textarea id="productDescription" rows="3" maxlength="5000"></textarea></label>
<label>교육 메모<textarea id="productContent" rows="3" maxlength="5000" placeholder="예) 포스에서 '포카치아'로 검색"></textarea></label>
<p id="productError" class="form-error" role="alert"></p>
<div class="form-actions"><button type="button" id="deleteProduct" class="quiet">삭제</button><button type="button" id="refreshProduct" class="secondary">홈페이지에서 갱신</button><button type="button" class="quiet" data-close="productDialog">취소</button><button id="productSave" class="primary">저장</button></div></form></dialog>
<div id="toast" role="status" hidden></div></body></html>
