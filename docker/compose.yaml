services:
  db:
    image: mysql:8.4
    # MYSQL_DATABASE/USER/PASSWORD must match DB_NAME/DB_USER/DB_PASSWORD in web-env.
    environment:
      MYSQL_DATABASE: tlj_notice
      MYSQL_USER: tlj
      MYSQL_PASSWORD: tlj_password
      MYSQL_ROOT_PASSWORD: tlj_root_password
    volumes:
      - ./DB:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptlj_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: web-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  uploads:
